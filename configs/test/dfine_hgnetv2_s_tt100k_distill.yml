# 文件名：dfine_hgnetv2_s_tt100k_distill.yml
__include__: [
  'tt100k.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
  '../distill/distill.yml'
]

print_freq: 200
output_dir: ./outputs/dfine_hgnetv2_s_tt100k_distill

DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      # lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      # lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 200 # 120 + 4n
train_dataloader:
  total_batch_size: 6
  dataset:
    transforms:
      policy:
        epoch: 164
  collate_fn:
    stop_epoch: 164
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 6

eval_spatial_size: [1024, 1024]
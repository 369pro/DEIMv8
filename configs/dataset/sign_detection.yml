task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 45 # your dataset classes
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${TT100K_ROOT}/TT100k-train/images
    ann_file: ${TT100K_ROOT}/TT100k-train/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 12
  drop_last: True
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${TT100K_ROOT}/TT100k-val/images
    ann_file: ${TT100K_ROOT}/TT100k-val/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 12
  drop_last: False
  pin_memory: True
  collate_fn:
    type: BatchImageCollateFunction

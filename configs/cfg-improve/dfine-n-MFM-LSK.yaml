backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32

encoder:
  # 使用MFM和LSK增强的P4/16和P5/32特征提取
  - [3, ConvNormLayer_fuse, [128, 1, 1]] # 5-P4/16
  - [4, ConvNormLayer_fuse, [128, 1, 1]] # 6-P5/32

  - [-1, TransformerEncoderBlock, [8, 512, 0.1, "relu", 10000, False]] # 7-P5/32

  # P4/16路径 - 使用MFM替代Concat，添加LSKBlock
  - [-1, ConvNormLayer_fuse, [128, 1, 1]] # 8
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 5], MFM, [128]] # 10-P4/16 (使用MFM替代Concat)
  - [-1, LSKBlock, []] # 11-P4/16 (添加LSKBlock增强空间特征)
  - [-1, RepNCSPELAN4, [128, 256, 21, 2, False, 'silu']] # 12-P4/16

  # P5/32路径 - 使用MFM替代Concat，添加LSKBlock
  - [-1, SCDown, [128, 3, 2, 'silu']] # 13-P5/32
  - [[-1, 8], MFM, [128]] # 14-P5/32 (使用MFM替代Concat)
  - [-1, LSKBlock, []] # 15-P5/32 (添加LSKBlock增强空间特征)
  - [-1, RepNCSPELAN4, [128, 256, 21, 2, False, 'silu']] # 16-P5/32

decoder:
  # 使用两尺度特征，保持dfine-n的轻量级配置
  - [[12, 16], DFINETransformer, {"feat_strides":[16, 32], "hidden_dim": 128, "num_levels": 2, "num_layers": 3, "num_points": [6, 6], "dim_feedforward": 512}]
backbone:
  # [from, module, args]
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']]  # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32

encoder:
  # 增加P3/8尺度特征提取，提升特征维度到160
  - [2, PSConv, [160, 1, 1]] # 5-P3/8 (新增P3/8尺度)
  - [3, PSConv, [160, 1, 1]] # 6-P4/16 (提升特征维度)
  - [4, PSConv, [160, 1, 1]] # 7-P5/32 (提升特征维度)

  # 增强Transformer配置
  - [-1, TransformerEncoderBlock, [8, 640, 0.1, "relu", 10000, False]] # 8-P5/32 (增加hidden_dim)

  # P4/16路径 - 使用MFM替代Concat，添加LSKBlock
  - [-1, PSConv, [160, 1, 1]] # 9
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], MFM, [160]] # 11-P4/16 (使用MFM替代Concat)
  - [-1, LSKBlock, []] # 12-P4/16 (添加LSKBlock增强空间特征)
  - [-1, C2f_Block, [160, {'module':InceptionDWBlock, 'param':{'mlp_ratio': 4.0}}, 2]] # 13-P4/16 (使用C2f_Block替代RepNCSPELAN4)

  # P3/8路径 - 新增高分辨率特征路径
  - [-1, PSConv, [160, 1, 1]] # 14
  - [-1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], MFM, [160]] # 16-P3/8 (新增P3/8特征融合)
  - [-1, LSKBlock, []] # 17-P3/8 (LSKBlock增强空间特征)
  - [-1, C2f_Block, [160, {'module':InceptionDWBlock, 'param':{'mlp_ratio': 4.0}}, 2]] # 18-P3/8

  # 增强P4/16路径
  - [-1, SCDown, [160, 3, 2, 'silu']] # 19-P4/16
  - [[-1, 14], MFM, [160]] # 20-P4/16 (增强特征融合)
  - [-1, LSKBlock, []] # 21-P4/16 (LSKBlock增强空间特征)
  - [-1, C2f_Block, [160, {'module':InceptionDWBlock, 'param':{'mlp_ratio': 4.0}}, 2]] # 22-P4/16

  # 增强P5/32路径
  - [-1, SCDown, [160, 3, 2, 'silu']] # 23-P5/32
  - [[-1, 9], MFM, [160]] # 24-P5/32 (增强特征融合)
  - [-1, LSKBlock, []] # 25-P5/32 (LSKBlock增强空间特征)
  - [-1, C2f_Block, [160, {'module':InceptionDWBlock, 'param':{'mlp_ratio': 4.0}}, 2]] # 26-P5/32

decoder:
  # 使用三尺度特征，增强Transformer配置
  - [[18, 22, 26], DFINETransformer, {"feat_strides":[8, 16, 32], "hidden_dim": 160, "num_levels": 3, "num_layers": 3, "num_points": [3, 6, 3], "dim_feedforward": 640}]

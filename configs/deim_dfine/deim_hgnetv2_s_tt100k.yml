__include__: [
  './dfine_hgnetv2_s_tt100k.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/deim-dfine_hgnetv2_s

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*(bn|norm)).*$'
      lr: 0.0002
    - 
      params: '^(?=.*(?:norm|bn)).*$'     # except bias
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
# epoches: 132 # 120 + 4n
epoches: 200
## Our LR-Scheduler
# flat_epoch: 64    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
flat_epoch: 96
# no_aug_epoch: 12
no_aug_epoch: 24

## Our DataAug
train_dataloader: 
  dataset: 
    transforms:
      policy:
        # epoch: [4, 64, 120]   # list 
        epoch: [4, 96, 176]

  collate_fn:
    # mixup_epochs: [4, 64]
    mixup_epochs: [4, 96]
    # stop_epoch: 120
    stop_epoch: 176
  total_batch_size: 8
val_dataloader:
  total_batch_size: 8
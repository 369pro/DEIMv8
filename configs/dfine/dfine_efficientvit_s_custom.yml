__include__: [
  # '../dataset/custom_detection.yml',
  '../dataset/sign_detection.yml',
  '../runtime.yml', 
  '../base/dataloader_dfine.yml',
  '../base/optimizer.yml',
  '../base/dfine_efficientvit.yml',
]

print_freq: 20
output_dir: ./outputs/dfine_efficientvit_s_custom

# 支持2K输入的配置
eval_spatial_size: [2048, 2048]

DEIM:
  backbone: EfficientViT

EfficientViT:
  name: 'S'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [128, 256, 512]  # 匹配EfficientViT-S的输出通道
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# 适应2K输入的训练配置
epoches: 132
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 120
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [2048, 2048], }  # 2K输入
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    stop_epoch: 120
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    base_size: 2048  # 2K基础尺寸
  total_batch_size: 2  # 由于2K图像很大，减小batch size

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [2048, 2048], }  # 2K输入
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  total_batch_size: 2
